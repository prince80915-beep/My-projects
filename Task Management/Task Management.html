<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Management App</title>

    <link rel="stylesheet" href="sytle3.css">
</head>

<body>

    <div class="app">

        <h1>Task Management App</h1>

        <div class="task-input">

    <input 
        type="text"
        id="taskInput"
        placeholder="Enter your task..."
    >

    <select id="priority">
        <option value="low">Low Priority</option>
        <option value="medium" selected>Medium Priority</option>
        <option value="high">High Priority</option>
    </select>

    <input 
        type="date"
        id="dueDate"
    >

    <button id="addTaskBtn">
        Add Task
    </button>

</div>
      <div class="search-box">
    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search your tasks..."
    >
</div>

        <div class="filters">
            <button class="filter active" data-filter="all">
                All
            </button>

            <button class="filter" data-filter="pending">
                Pending
            </button>

            <button class="filter" data-filter="completed">
                Completed
            </button>
        </div>

        <ul id="taskList"></ul>

        <div class="task-info">
            <span>
                Total: <b id="totalTasks">0</b>
            </span>

            <span>
                Completed: <b id="completedTasks">0</b>
            </span>

            <span>
                Pending: <b id="pendingTasks">0</b>
            </span>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
