<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ForgeFit Admin</title><link rel="stylesheet" href="project-admin.css"></head><body><div class="wrap"><div class="top"><div><div class="brand">FORGEFIT ADMIN</div><div class="muted">Gym management demo</div></div><div class="row"><a class="btn alt" href="gym.html">View Gym</a><a class="btn" href="admin-hub.html">All Admin</a></div></div><div class="grid"><div class="card"><h3>Programs</h3><div class="stat" id="programsCount">0</div></div><div class="card"><h3>Memberships</h3><div class="stat" id="plansCount">0</div></div><div class="card"><h3>Enquiries</h3><div class="stat" id="enquiriesCount">0</div></div><div class="card"><h2>Add Program</h2><div class="form"><label>Name<input id="pTitle"></label><label>Details<textarea id="pDetail"></textarea></label><button class="btn" onclick="addItem('gymPrograms','pTitle','pDetail')">Add Program</button></div></div><div class="card"><h2>Add Membership</h2><div class="form"><label>Plan<input id="mTitle"></label><label>Price / Details<input id="mDetail"></label><button class="btn" onclick="addItem('gymPlans','mTitle','mDetail')">Add Membership</button></div></div><div class="card"><h2>Programs List</h2><div id="programList" class="list"></div></div><div class="card wide"><h2>Membership List</h2><div id="planList" class="list"></div></div></div></div><script src="project-admin.js"></script><script>stat('gymPrograms','programsCount');stat('gymPlans','plansCount');stat('gymEnquiries','enquiriesCount');renderList('gymPrograms','programList');renderList('gymPlans','planList');</script></body></html>
