<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopCart | E-Commerce Demo</title><link rel="stylesheet" href="ecommerce.css"></head><body>
<header><a href="index.html" class="logo">Shop<span>Cart</span></a><div class="header-actions"><button id="cartBtn">🛒 Cart <b id="cartCount">0</b></button><a href="index.html">Portfolio</a></div></header>
<main><section class="store-hero"><div><small>ORIGINAL DEMO STORE</small><h1>Good products.<br><span>Simple shopping.</span></h1><p>A front-end e-commerce project with a real browser cart powered by LocalStorage.</p></div><div class="hero-shape">🛍️</div></section>
