<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Learning — LearnHub</title><link rel="stylesheet" href="learnhub-pages.css"></head><body><header class="top"><a class="brand" href="coaching.html"><span>LH</span><div><b>LearnHub</b><small>Learning platform</small></div></a><nav class="nav"><a href="coaching.html">Home</a><a href="courses.html">Courses</a><a href="batches.html">Batches</a><a href="classes.html">Classes</a><a href="materials.html">Study PDFs</a><a href="practice.html">Practice</a><a href="my-learning.html">My Learning</a><a href="support.html">Support</a><a href="profile.html">Profile</a></nav><div class="user"><span data-name></span> · <button id="logout">Logout</button></div></header><main class="wrap"><span class="eyebrow">YOUR DASHBOARD</span><h1 class="title">Keep learning, <span data-name></span>.</h1><p class="muted">Your enrolled courses and progress are saved in this browser.</p><div id="grid" class="grid" style="margin-top:28px"></div></main><footer><span>© 2026 LearnHub</span><span>Original learning demo</span></footer><script src="learnhub-pages.js"></script><script>const courses=['Frontend Foundations','JavaScript in Practice','UI Design Basics','Web Project Builder','JavaScript APIs','Portfolio Mastery'];const ids=JSON.parse(localStorage.getItem('learnhubEnrollments')||'[]');const box=document.getElementById('grid');box.innerHTML=ids.length?ids.map((id,i)=>{let n=courses[id-1]||courses[0],p=Math.min(30+i*18,86);return `<article class="card"><span class="eyebrow">IN PROGRESS</span><h3>${n}</h3><p>Continue lessons, complete the next practice task and build your project.</p><div class="progress"><i style="width:${p}%"></i></div><small>${p}% complete</small><div style="margin-top:16px"><button class="btn" onclick="alert('Learning module opened for ${n}.')">Continue learning</button></div></article>`}).join(''):'<article class="card"><h3>No courses yet</h3><p>Explore the course library and enroll in your first course.</p><a class="btn alt" href="courses.html">Explore courses</a></article>';</script></body></html>
