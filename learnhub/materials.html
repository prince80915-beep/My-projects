<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study PDFs — LearnHub</title><link rel="stylesheet" href="learnhub-pages.css"></head><body><header class="top"><a class="brand" href="coaching.html"><span>LH</span><div><b>LearnHub</b><small>Learning platform</small></div></a><nav class="nav"><a href="coaching.html">Home</a><a href="courses.html">Courses</a><a href="batches.html">Batches</a><a href="classes.html">Classes</a><a href="practice.html">Practice</a><a href="materials.html">Study PDFs</a><a href="my-learning.html">My Learning</a><a href="support.html">Support</a><a href="profile.html">Profile</a></nav><div class="user"><span data-name></span> · <button id="logout">Logout</button></div></header><main class="wrap"><span class="eyebrow">STUDY MATERIAL</span><h1 class="title">Your notes & PDFs.</h1><p class="muted">Study material uploaded by the course admin.</p><div id="pdfGrid" class="grid" style="margin-top:28px"></div></main><footer><span>© 2026 LearnHub</span><span>Original learning platform</span></footer><script src="learnhub-content.js"></script><script src="learnhub-pages.js"></script><script>
async function render(){try{await LearnHubContent.sync()}catch(e){}const a=LearnHubContent.materials(),box=document.getElementById('pdfGrid');box.innerHTML=a.length?a.map(x=>`<article class="card"><span class="eyebrow">PDF · ${x.subject}</span><h3>${x.title}</h3><p>${x.desc||'Study material for revision.'}</p><small>${x.fileName} · ${x.date}</small><div style="margin-top:16px"><button class="btn" onclick="openPdf(${x.id})">📄 Open PDF</button> <button class="btn alt" onclick="downloadPdf(${x.id})">⬇ Download</button></div></article>`).join(''):'<article class="card"><h3>No PDFs yet</h3><p>Study PDFs uploaded by the admin will appear here.</p></article>'}
function openPdf(id){window.open(LearnHubContent.pdfUrl(id),'_blank')}
function downloadPdf(id){const x=LearnHubContent.materials().find(m=>m.id===id);const a=document.createElement('a');a.href=LearnHubContent.pdfUrl(id);a.download=x?.fileName||'study-material.pdf';a.click()}
render();</script></body></html>
