<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Quiz — LearnHub</title><link rel="stylesheet" href="learnhub-pages.css"><style>.quiz-card{max-width:760px;margin:25px auto;background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:26px}.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d0d5dd;border-radius:10px;padding:13px;margin:9px 0;cursor:pointer}.option.selected{border-color:#5b4bdb;background:#f0edff}.result{font-weight:900;font-size:18px}</style></head><body><header class="top"><a class="brand" href="coaching.html"><span>LH</span><div><b>LearnHub</b><small>Learning platform</small></div></a><nav class="nav"><a href="coaching.html">Home</a><a href="courses.html">Courses</a><a href="batches.html">Batches</a><a href="classes.html">Classes</a><a href="practice.html">Practice</a><a href="materials.html">Study PDFs</a><a href="my-learning.html">My Learning</a><a href="support.html">Support</a></nav><div class="user"><span data-name></span> · <button id="logout">Logout</button></div></header><main class="wrap"><span class="eyebrow">DAILY QUIZ</span><h1 class="title">Test what you learned.</h1><div id="quiz" class="quiz-card"></div></main><script src="learnhub-content.js"></script><script src="learnhub-pages.js"></script><script>let qs=[],i=0,score=0,chosen=null;const box=document.getElementById('quiz');function render(){if(!qs.length){box.innerHTML='<h2>No questions yet</h2><p class="muted">Add original questions from the private admin panel.</p><a class="btn alt" href="practice.html">Back to Practice</a>';return}const q=qs[i];chosen=null;box.innerHTML=`<small>Question ${i+1} of ${qs.length} · ${q.topic}</small><h2>${q.question}</h2><div>${q.options.map((o,n)=>`<button class="option" data-i="${n}">${'ABCD'[n]}. ${o}</button>`).join('')}</div><button class="btn alt" id="next" disabled>${i===qs.length-1?'Finish quiz':'Next question'}</button>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');chosen=Number(b.dataset.i);document.getElementById('next').disabled=false});document.getElementById('next').onclick=()=>{if(chosen===q.answer)score++;i++;if(i<qs.length)render();else box.innerHTML=`<div class="result">🎉 Quiz complete: ${score}/${qs.length}</div><p class="muted">Keep practicing and improve your score.</p><a class="btn alt" href="practice.html">Back to Practice</a>`}}(async()=>{try{await LearnHubContent.sync()}catch(e){}qs=LearnHubContent.questions();render()})();</script></body></html>
