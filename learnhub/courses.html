<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LearnHub Courses</title><link rel="stylesheet" href="learnhub-pages.css"></head><body><header class="top"><a class="brand" href="coaching.html"><span>LH</span><div><b>LearnHub</b><small>Learning platform</small></div></a><nav class="nav"><a href="coaching.html">Home</a><a href="courses.html">Courses</a><a href="batches.html">Batches</a><a href="classes.html">Classes</a><a href="materials.html">Study PDFs</a><a href="practice.html">Practice</a><a href="my-learning.html">My Learning</a><a href="support.html">Support</a><a href="profile.html">Profile</a></nav><div class="user"><span data-name></span> · <button id="logout">Logout</button></div></header><main class="wrap"><span class="eyebrow">COURSE LIBRARY</span><h1 class="title">Choose a skill to build.</h1><p class="muted">Original demo courses designed around practical web-development learning.</p><div class="toolbar"><input id="search" class="search" placeholder="Search courses..."><select id="level" class="select"><option value="all">All levels</option><option>Beginner</option><option>Intermediate</option></select></div><div id="grid" class="grid"></div></main><footer><span>© 2026 LearnHub</span><span>Original learning demo</span></footer><script src="learnhub-pages.js"></script><script>const data=[['💻','Frontend Foundations','WEB DEVELOPMENT','Build responsive pages with HTML, CSS and JavaScript.','Beginner','₹999'],['⚡','JavaScript in Practice','JAVASCRIPT','DOM, events, LocalStorage and practical app logic.','Intermediate','₹1499'],['🎨','UI Design Basics','DESIGN','Create clean interfaces, layouts and responsive components.','Beginner','₹799'],['🧩','Web Project Builder','PROJECTS','Turn an idea into a multi-page working website.','Beginner','₹1299'],['🌐','JavaScript APIs','API & DATA','Connect frontend apps to APIs with loading and error states.','Intermediate','₹1599'],['🚀','Portfolio Mastery','CAREER','Present your original work with a professional portfolio.','Beginner','₹699']];function render(){let q=document.getElementById('search').value.toLowerCase(),l=document.getElementById('level').value;document.getElementById('grid').innerHTML=data.filter(x=>(l==='all'||x[4]===l)&&(x[1]+x[2]+x[3]).toLowerCase().includes(q)).map((x,i)=>`<article class="card"><div class="icon">${x[0]}</div><span class="eyebrow">${x[2]}</span><h3>${x[1]}</h3><p>${x[3]}</p><small>${x[4]} · 12 lessons</small><div class="price">${x[5]}</div><button class="btn alt" onclick="enroll(${i})">Purchase & Enroll</button></article>`).join('')||'<p class="muted">No courses found.</p>'}function enroll(i){let ids=JSON.parse(localStorage.getItem('learnhubEnrollments')||'[]');if(!ids.includes(i+1)){ids.push(i+1);localStorage.setItem('learnhubEnrollments',JSON.stringify(ids));alert('Course added to My Learning ✓')}else alert('Already enrolled.')}document.getElementById('search').oninput=render;document.getElementById('level').onchange=render;render();</script></body></html>
