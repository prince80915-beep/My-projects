<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Olive & Ember Admin</title><link rel="stylesheet" href="project-admin.css"></head><body><div class="wrap"><div class="top"><div><div class="brand">OLIVE & EMBER ADMIN</div><div class="muted">Restaurant management demo</div></div><div class="row"><a class="btn alt" href="restaurant.html">View Restaurant</a><a class="btn" href="admin-hub.html">All Admin</a></div></div><div class="grid"><div class="card"><h3>Menu Items</h3><div class="stat" id="menuCount">0</div></div><div class="card"><h3>Reservations</h3><div class="stat" id="reserveCount">0</div></div><div class="card"><h3>Offers</h3><div class="stat" id="offerCount">0</div></div><div class="card"><h2>Add Menu Item</h2><div class="form"><label>Dish<input id="dTitle"></label><label>Price / Details<input id="dDetail"></label><button class="btn" onclick="addItem('restaurantMenu','dTitle','dDetail')">Add Dish</button></div></div><div class="card"><h2>Add Offer</h2><div class="form"><label>Offer<input id="oTitle"></label><label>Details<input id="oDetail"></label><button class="btn" onclick="addItem('restaurantOffers','oTitle','oDetail')">Add Offer</button></div></div><div class="card"><h2>Menu</h2><div id="menuList" class="list"></div></div><div class="card wide"><h2>Offers</h2><div id="offerList" class="list"></div></div></div></div><script src="project-admin.js"></script><script>stat('restaurantMenu','menuCount');stat('restaurantReservations','reserveCount');stat('restaurantOffers','offerCount');renderList('restaurantMenu','menuList');renderList('restaurantOffers','offerList');</script></body></html>
